<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=], initial-scale=1.0">
    <title>calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--elementos básicos da calculadora-->
    <div id="corpo">
        <div id="telaP">
            <p id="telap" class="telaPrincipal">
                  
            </p>
        </div>
        <div>
            <button id="1">1</button> <button id="2">2</button>
            <button id="3">3</button> <button id="4">4</button>
            <button id="5">5</button> <button id="6">6</button>
            <button id="7">7</button> <button id="8">8</button>
            <button id="9">9</button> <button id="0">0</button>
        </div>
        <div id="operacoes">
            <button id="soma">+</button>
            <button id="menos">-</button>
            <button id="divisao">/</button>
            <button id="multiplicacao">x</button>
            <button id="igualdade">=</button>
        </div>
        <button id="reset">reset</button>
    </div>
    <!------------------------------------>
<!--funções JS-->
    <script src="VarDOM.js"></script>
<!-------------->
</body>
</html>
